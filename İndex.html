<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTW Project - APK Repository</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --border-color: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }
        h1 {
            margin: 0;
            font-size: 24px;
            color: var(--accent-color);
        }
        select {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        .description {
            color: var(--text-muted);
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .apk-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .apk-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s, border-color 0.2s;
        }
        .apk-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }
        .apk-info h3 {
            margin: 0 0 5px 0;
            font-size: 18px;
        }
        .apk-info span {
            font-size: 13px;
            color: var(--text-muted);
        }
        .download-btn {
            background-color: var(--accent-color);
            color: #0f172a;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .download-btn:hover {
            background-color: var(--accent-hover);
        }
        .loading, .error {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 id="title">🚀 BTW Project</h1>
        <select id="langSelect" onchange="changeLanguage()">
            <option value="tr">Türkçe</option>
            <option value="en">English</option>
            <option value="de">Deutsch</option>
            <option value="ru">Русский</option>
            <option value="es">Español</option>
        </select>
    </header>

    <div class="description" id="desc">
        Bu sayfadan deponuzdaki tüm modlanmış APK dosyalarını doğrudan indirebilirsiniz. Dosyalar otomatik olarak listelenmektedir.
    </div>

    <div id="content">
        <div class="loading" id="loadingText">APK dosyaları yükleniyor...</div>
    </div>
</div>

<script>
    // ⚙️ BURAYI KENDİ KULLANICI ADI VE REPO ADINIZLA DEĞİŞTİRİN
    const GITHUB_USER = 'ardacy2112';
    const GITHUB_REPO = 'BreakTheWall-The-BTW-Project';

    const translations = {
        tr: {
            title: "🚀 BTW Project - APK Arşivi",
            desc: "Bu sayfadan deponuzdaki tüm modlanmış APK dosyalarını doğrudan indirebilirsiniz. Dosyalar otomatik olarak listelenmektedir.",
            loading: "APK dosyaları yükleniyor...",
            download: "İndir",
            noApp: "Depoda hiç APK dosyası bulunamadı.",
            error: "APK dosyaları yüklenirken bir hata oluştu."
        },
        en: {
            title: "🚀 BTW Project - APK Archive",
            desc: "You can directly download all modded APK files in your repository from this page. Files are listed automatically.",
            loading: "Loading APK files...",
            download: "Download",
            noApp: "No APK files found in the repository.",
            error: "An error occurred while loading APK files."
        },
        de: {
            title: "🚀 BTW Project - APK Archiv",
            desc: "Sie können alle modifizierten APK-Dateien in Ihrem Repository direkt von dieser Seite herunterladen.",
            loading: "APK-Dateien werden geladen...",
            download: "Herunterladen",
            noApp: "Keine APK-Dateien im Repository gefunden.",
            error: "Beim Laden der APK-Dateien ist ein Fehler aufgetreten."
        },
        ru: {
            title: "🚀 BTW Project - Архив APK",
            desc: "Вы можете напрямую скачать все модифицированные APK-файлы из вашего репозитория с этой страницы.",
            loading: "Загрузка APK файлов...",
            download: "Скачать",
            noApp: "В репозитории не найдено APK файлов.",
            error: "Произошла ошибка при загрузке APK файлов."
        },
        es: {
            title: "🚀 BTW Project - Archivo APK",
            desc: "Puedes descargar directamente todos los archivos APK modificados en tu repositorio desde esta página.",
            loading: "Cargando archivos APK...",
            download: "Descargar",
            noApp: "No se encontraron archivos APK en el repositorio.",
            error: "Ocurrió un error al cargar los archivos APK."
        }
    };

    function changeLanguage() {
        const lang = document.getElementById('langSelect').value;
        document.getElementById('title').innerText = translations[lang].title;
        document.getElementById('desc').innerText = translations[lang].desc;
        const loadingEl = document.getElementById('loadingText');
        if (loadingEl) loadingEl.innerText = translations[lang].loading;
        fetchAPKs();
    }

    async function fetchAPKs() {
        const contentDiv = document.getElementById('content');
        const lang = document.getElementById('langSelect').value;
        
        try {
            const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents`);
            if (!response.ok) throw new Error('API Error');
            
            const files = await response.json();
            const apkFiles = files.filter(file => file.name.endsWith('.apk'));

            if (apkFiles.length === 0) {
                contentDiv.innerHTML = `<div class="loading">${translations[lang].noApp}</div>`;
                return;
            }

            let html = '<div class="apk-list">';
            apkFiles.forEach(apk => {
                // Doğrudan indirme / ham dosya linki
                const downloadUrl = apk.download_url;
                const fileSizeMB = (apk.size / (1024 * 1024)).toFixed(2);

                html += `
                    <div class="apk-card">
                        <div class="apk-info">
                            <h3>📦 ${apk.name}</h3>
                            <span>Boyut / Size: ${fileSizeMB} MB</span>
                        </div>
                        <a href="${downloadUrl}" class="download-btn" target="_blank">${translations[lang].download}</a>
                    </div>
                `;
            });
            html += '</div>';
            contentDiv.innerHTML = html;

        } catch (err) {
            contentDiv.innerHTML = `<div class="error">${translations[lang].error}</div>`;
        }
    }

    // Sayfa açıldığında çalıştır
    fetchAPKs();
</script>

</body>
</html>
